# cargo-about configuration for CheapSeek. `cargo about generate about.hbs`
# writes one HTML page with the license of every crate that a CheapSeek
# executable links, and the text of each license. Each release holds that
# page, and CI makes it on every push, so a crate under a license outside the
# list below fails there and not on the day of a release.

# The licenses a crate may be under, the same ones as in deny.toml. The order
# is the order of choice: for a crate under "MIT OR Apache-2.0" the page gives
# the license that comes first here.
accepted = [
    "Apache-2.0",
    "MIT",
    "BSL-1.0",
    "MIT-0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
]

# The three systems a release has an executable for. A crate that only
# another system uses stays off the page.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Tests and build scripts are not part of an executable.
ignore-dev-dependencies = true
ignore-build-dependencies = true
