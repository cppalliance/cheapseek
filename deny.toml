# cargo-deny configuration for CheapSeek (BSL-1.0).
# Run locally with `cargo deny check`; CI runs the same.

[graph]
# Check the dependency graph with all features enabled, not just the defaults.
all-features = true

[advisories]
version = 2
# Vulnerabilities and yanked crates always fail. "unmaintained" is scoped to
# crates this package depends on directly, so we are accountable for our own
# choices without failing CI on unmaintained deep-transitive crates we cannot
# control.
unmaintained = "workspace"
yanked = "deny"
# Reviewed advisories consciously accepted go here, each with a rationale.
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with distributing a BSL-1.0 package.
allow = [
    "BSL-1.0",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
# Warn on duplicate versions of the same crate so unification regressions are
# visible without hard-failing the graph.
multiple-versions = "warn"
wildcards = "warn"

# A reply writes its JSON objects with sorted keys. `preserve_order` would
# replace that with insertion order for every crate in the graph, and a test
# build could then answer with different bytes than a release build.
[[bans.features]]
crate = "serde_json"
deny = ["preserve_order"]

[sources]
# crates.io is the only registry. The one git source is the C++ Alliance
# fork of RustBot, the chat brain, which lives on GitHub only; `Cargo.toml`
# pins its commit.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/cppalliance/rustbot"]
