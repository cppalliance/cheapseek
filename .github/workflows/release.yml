name: Release
run-name: CheapSeek executables (${{ github.event_name == 'push' && github.ref_name || 'dispatched' }})

# Builds the `cheapseek` executable for Linux, macOS and Windows, and holds
# each one to the recorded replies. A vX.Y.Z tag then publishes the three
# with SHA256SUMS and a page of third-party licenses as a GitHub release,
# starts the published files through the action on all three systems, and
# moves the major tag to the release.
# A job that fails stops the jobs after it.
#
# What starts a run:
# - A pushed vX.Y.Z tag that names the version in Cargo.toml: every job.
#   Only cppalliance/cheapseek publishes: in a copy of the repository the
#   run ends after the builds.
# - A manual run on any ref: the builds and their checks. The executables
#   stay as workflow artifacts for 7 days.
#
# AGENTS.md holds the rules of a release.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.triple }})
    # A build takes a few minutes. A hung one should not hold the run for
    # GitHub's 6-hour default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 keeps the executable at the glibc 2.35 floor.
          - runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            suffix: ""
          - runner: macos-latest
            triple: aarch64-apple-darwin
            suffix: ""
          - runner: windows-latest
            triple: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.runner }}
    env:
      TRIPLE: ${{ matrix.triple }}
      # The name of the file in a release. `action/start.sh` downloads the
      # executable under this name.
      ASSET: cheapseek-${{ matrix.triple }}${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The action finds its release through the version in Cargo.toml, so a
      # tag has to name that version before anything is built.
      - name: Check the tag against Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "the version in Cargo.toml is '$version', which is not X.Y.Z"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag $GITHUB_REF_NAME does not name the version in Cargo.toml, which is $version"
            exit 1
          fi
          echo "Version in Cargo.toml: $version" | tee -a "$GITHUB_STEP_SUMMARY"

      # The build is for the runner's own processor and system. A runner
      # label that moves to another one, as `macos-latest` did from Intel to
      # Apple silicon, fails here and not in a user's job.
      - name: Check the runner against the name of the executable
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -vV | awk '/^host: / { print $2 }')
          [ "$host" = "$TRIPLE" ] ||
            { echo "this runner builds for $host, and the executable is named for $TRIPLE"; exit 1; }

      # This workflow restores no cache. Every part of a released executable
      # is compiled in this job, from the sources that Cargo.lock names, and
      # a manual run builds the same way as the run of a tag.
      - name: Build
        run: cargo build --release --locked

      # The copy has the name it has in a release, and it sits outside the
      # repository, so the build tree holds no running executable.
      - name: Name the executable
        shell: bash
        env:
          BUILT: target/release/cheapseek${{ matrix.suffix }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$BUILT" "$RUNNER_TEMP/dist/$ASSET"
          ls -l "$RUNNER_TEMP/dist"

      # The release profile strips the symbol table, which was a quarter of
      # the Linux file. A profile that loses the setting fails here.
      - name: Check that the executable holds no symbol table
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sections=$(readelf --section-headers --wide "$RUNNER_TEMP/dist/$ASSET")
          if grep -q -F '.symtab' <<< "$sections"; then
            echo "$ASSET still has a .symtab section"
            exit 1
          fi

      - name: Start the executable through the action
        id: cheapseek
        uses: ./
        with:
          executable: ${{ runner.temp }}/dist/${{ env.ASSET }}

      # The same request gets the same bytes from every build, so the
      # release build has to give the replies that the tests recorded.
      - name: Compare the recorded replies
        shell: bash
        env:
          BASE_URL: ${{ steps.cheapseek.outputs.base-url }}
        run: bash action/check.sh "$BASE_URL"

      - name: Upload the executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executable-${{ matrix.triple }}
          path: ${{ runner.temp }}/dist/${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  # An executable holds the code of about a hundred crates, and the license
  # of each one asks that its text goes where the code goes. This job writes
  # one page with the license of every such crate and the text of each
  # license. `about.toml` lists the licenses a crate may be under, and a
  # crate under another one fails the job.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-about

      - name: Write the page of licenses
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/THIRD-PARTY-LICENSES.html"
          cargo about generate --locked --fail about.hbs --output-file "$page"
          # The page has to name the chat bot and hold the text of its
          # license, or the generator has stopped doing its work.
          grep -q -F '>rustbot ' "$page" || { echo "the page does not name rustbot"; exit 1; }
          grep -q -F 'Apache License' "$page" ||
            { echo "the page holds no text of the Apache License"; exit 1; }
          ls -l "$page"

      - name: Upload the page of licenses
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licenses
          path: ${{ runner.temp }}/THIRD-PARTY-LICENSES.html
          if-no-files-found: error
          retention-days: 7

  # One repository publishes. A copy that is not a fork runs the builds for
  # a tag pushed to it, and without this condition it would publish a
  # release of its own, which the action never downloads. After a rename of
  # the repository, the name here has to follow, or a tag publishes nothing.
  publish:
    needs: [build, licenses]
    if: ${{ github.repository == 'cppalliance/cheapseek' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: executable-*
          path: dist
          merge-multiple: true

      - name: Download the page of licenses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licenses
          path: dist

      - name: Write SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          executables=(
            cheapseek-x86_64-unknown-linux-gnu
            cheapseek-aarch64-apple-darwin
            cheapseek-x86_64-pc-windows-msvc.exe
          )
          for name in "${executables[@]}"; do
            [ -s "$name" ] || { echo "the builds left no $name"; ls -la; exit 1; }
          done
          # Exactly these files: a fourth one would be published too.
          found=$(find . -maxdepth 1 -name 'cheapseek-*' | wc -l)
          [ "$found" -eq "${#executables[@]}" ] ||
            { echo "expected ${#executables[@]} executables, found $found"; ls -la; exit 1; }
          [ -s THIRD-PARTY-LICENSES.html ] || { echo "the page of licenses is missing"; ls -la; exit 1; }
          sha256sum "${executables[@]}" THIRD-PARTY-LICENSES.html > SHA256SUMS
          sha256sum --check SHA256SUMS
          {
            echo "### CheapSeek $GITHUB_REF_NAME"
            echo
            echo '```text'
            cat SHA256SUMS
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: CheapSeek ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/cheapseek-*
            dist/SHA256SUMS
            dist/THIRD-PARTY-LICENSES.html

  # The published release, the way a user's job gets it: the action at the
  # tag downloads the executable for its runner, checks the sum, and starts
  # it. The Linux job runs on a newer Ubuntu than the one that built.
  verify:
    name: verify (${{ matrix.runner }})
    needs: publish
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: released

      - name: Start the released executable through the action
        id: cheapseek
        uses: ./released

      - name: Compare the recorded replies
        shell: bash
        env:
          BASE_URL: ${{ steps.cheapseek.outputs.base-url }}
        run: bash released/action/check.sh "$BASE_URL"

  # `v1` is the name a workflow writes after `cppalliance/cheapseek@`. It
  # moves here alone, and only after the release worked through the action
  # on three systems. A release of an older line, published after a newer
  # one, leaves the major tag on the newer one.
  major-tag:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Move the major tag to this release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          major=${GITHUB_REF_NAME%%.*}
          newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$major." --jq '.[].ref' |
            sed 's|^refs/tags/||' | grep -E "^$major\.[0-9]+\.[0-9]+$" | sort --version-sort | tail -n 1)
          if [ "$newest" != "$GITHUB_REF_NAME" ]; then
            echo "$major stays where it is: its newest release is $newest, and this one is $GITHUB_REF_NAME"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$major" -f sha="$GITHUB_SHA" > /dev/null
          fi
          echo "$major now names $GITHUB_REF_NAME, commit $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  # The line a user's workflow holds, run once on each system. `uses:` takes
  # no expression, so a new major version has to change the reference here.
  proof:
    name: proof (${{ matrix.runner }})
    needs: major-tag
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      # The checkout brings `check.sh` and the recorded replies. The action
      # comes from the major tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start a server the way a user's workflow does
        id: cheapseek
        uses: cppalliance/cheapseek@v1

      - name: Compare the recorded replies
        shell: bash
        env:
          BASE_URL: ${{ steps.cheapseek.outputs.base-url }}
        run: bash action/check.sh "$BASE_URL"
